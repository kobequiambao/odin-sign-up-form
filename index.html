<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background-container">

    </div>
    <div id="right-side-container">
        <div id="hook-container">
            <h1>This is not a real online service! You know you need
                something like this in your life to help you realize
                your deepest dreams. Sign up now to get started.
            </h1>

            <h1>You know you want to.</h1>
        </div>

        <div id="form-container">
            <div class="form-row">
                <h2>Let's do this!</h2>
            </div>
            <div class="form-row">
                <div>
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first_name">
                </div>
                <div>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last_name">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label for="mail">Email</label>
                    <input type="email" id="mail" name="mail">
                </div>
                <div>
                    <label for="phone-num">Phone Number</label>
                    <input type="text" id="phone_num" name="phone-num">
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>
                <div>
                    <label for="confirm-pass">Confirm Password</label>
                    <input type="password" id="confirm-pass" name="confirm_pass">
                </div>
            </div>
        </div>
        
        <div id="bottom-container">
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>
        </div>
    </div>

</body>
</html>
